name: build-apk
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q yourcoach_flutter.zip
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: subosito/flutter-action@v2
        with: { channel: stable }
      - name: Patch and build
        working-directory: yourcoach/app
        run: |
          flutter create . --platforms=android --project-name your_coach
          sed -i 's/flutter.minSdkVersion/26/' android/app/build.gradle*
          sed -i 's|<application|<uses-permission android:name="android.permission.CAMERA"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: your-coach-apk
          path: yourcoach/app/build/app/outputs/flutter-apk/app-release.apk
